# fly.toml app configuration file generated for truevow-ai on 2026-06-11T16:16:31+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'truevow-ai'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = '15s'
  timeout = '5s'
  grace_period = '10s'
  method = 'get'
  path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
